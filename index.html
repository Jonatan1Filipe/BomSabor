<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bom Sabor - Receitas Fáceis</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/icone-bomsabor.png" type="image/x-icon">
</head>
<body>
  <!-- Cabeçalho -->
  <header id="header">
    <div class="container">
      <div class="header-content">
        <a href="#home" class="logo">
          <img src="img/logo-bomsabor.png" alt="Bom Sabor">
        </a>

        <nav class="nav-menu">
          <a href="#home" class="nav-link active">Home</a>
          <a href="#receitas" class="nav-link">Receitas</a>
          <a href="#categorias" class="nav-link">Categorias</a>
          <a href="sobre.html" class="nav-link">Sobre</a>
        </nav>

        <div class="header-actions">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar receitas...">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </div>
          <a href="#adicionar" class="btn btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span class="btn-text">Adicionar Receita</span>
          </a>
        </div>

      </div>
    </div>
  </header>

  <!-- Conteúdo Main -->
  <main id="mainContent"></main>

  <!-- Rodapé -->
  <footer id="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-section">
          <h4>Links Rápidos</h4>
          <ul>
            <li><a href="contato.html">Contato</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="#privacidade">Política de Privacidade</a></li>
            <li><a href="#termos">Termos de Uso</a></li>
          </ul>
        </div>

        <div class="footer-section">
          <h4>Newsletter</h4>
          <p>Receba receitas exclusivas no seu e-mail</p>
          <form id="newsletterForm" class="newsletter-form">
            <input type="email" placeholder="Seu e-mail" required>
            <button type="submit">Inscrever</button>
          </form>
          <p id="newsletterMsg" class="newsletter-msg"></p>
        </div>

        <div class="footer-section">
          <h4>Redes Sociais</h4>
          <div class="social-icons">
            <a href="#" class="social-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
              </svg>
            </a>
            <a href="#" class="social-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="#fff"></path>
                <circle cx="17.5" cy="6.5" r="1.5" fill="#fff"></circle>
              </svg>
            </a>
            <a href="#" class="social-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
              </svg>
            </a>
            <a href="#" class="social-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6" stroke="#fff" fill="none"></polyline>
              </svg>
            </a>
          </div>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2025 Bom Sabor. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
